<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopApp</title>
<style>
:root{--bg:#f6f5fb;--ink:#17152b;--mute:#6b6884;--card:#fff;--line:#e8e6f3;--accent:#5b3df5;--accent2:#8b5cf6;--ok:#10b981}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:1rem}
.cart{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem}
.cart b{background:var(--accent2);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;padding:0 6px}
.hero{max-width:1100px;margin:0 auto;padding:36px 20px 8px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-.03em;line-height:1.1}
.hero p{color:var(--mute);margin-top:8px}
main{max-width:1100px;margin:0 auto;padding:20px;flex:1;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px -12px rgba(40,30,100,.25)}
.art{height:170px;position:relative;overflow:hidden}
.art::before,.art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
.art::before{width:150px;height:150px;right:-40px;top:-50px}
.art::after{width:90px;height:90px;left:-20px;bottom:-30px;background:rgba(0,0,0,.12)}
.chip{position:absolute;left:12px;top:12px;z-index:1;background:rgba(255,255,255,.92);color:var(--ink);font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.body h3{font-size:1.05rem}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-size:1.25rem;font-weight:800}
button{font:inherit;font-weight:600;font-size:.88rem;border:0;cursor:pointer;color:#fff;padding:9px 14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .1s,filter .2s}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.96)}
.msg{padding:40px;text-align:center;color:var(--mute)}
footer{border-top:1px solid var(--line);background:#fff;padding:18px 20px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:999px;padding:6px 14px;font:600 .82rem ui-monospace,SFMono-Regular,Menlo,monospace}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #a7f3d0}
.pill.err{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.pill.err::before{background:#ef4444;box-shadow:0 0 0 3px #fecaca}
@media(max-width:480px){.bar{padding:12px 16px}.hero{padding:24px 16px 0}main{padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><i>S</i>ShopApp</div>
  <div class="cart" aria-live="polite">Cart <b id="count">0</b></div>
</div></header>
<section class="hero"><h1>Everyday essentials,<br>delivered fast.</h1><p>Hand-picked products from our catalog.</p></section>
<main><div id="grid" class="grid"><p class="msg">Loading products...</p></div></main>
<footer><span id="pill" class="pill">Connecting...</span></footer>
<script>
const grid=document.getElementById('grid'),pill=document.getElementById('pill'),countEl=document.getElementById('count');
let count=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#6b6884';
function tile(p){
  const c=safeColor(p.color);
  return `<article class="tile"><div class="art" style="background:linear-gradient(135deg,${c},color-mix(in srgb,${c} 45%,#000))"><span class="chip">${esc(p.category)}</span></div>
  <div class="body"><h3>${esc(p.name)}</h3><div class="row"><span class="price">$${Number(p.price).toFixed(2)}</span><button type="button">Add to cart</button></div></div></article>`;
}
grid.addEventListener('click',e=>{if(e.target.closest('button')){countEl.textContent=++count}});
fetch('/api/products').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  grid.innerHTML=d.products.map(tile).join('');
  pill.textContent=`Served by pod ${d.pod} · ${d.version}`;
}).catch(()=>{
  grid.innerHTML='<p class="msg">Products are unavailable right now. Please retry shortly.</p>';
  pill.textContent='Backend unavailable';pill.classList.add('err');
});
</script>
</body>
</html>
