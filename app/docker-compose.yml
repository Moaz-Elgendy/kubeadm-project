services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shopapp
      MYSQL_USER: shopapp
      MYSQL_PASSWORD: shoppass
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: shopapp
      DB_PASSWORD: shoppass
      DB_NAME: shopapp
      APP_VERSION: local
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
