apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Moaz-Elgendy/kubeadm-project.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: shopapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
