apiVersion: v1
kind: Service
metadata:
  name: shopapp-db
  namespace: shopapp
  labels:
    app.kubernetes.io/name: shopapp-db
    app: shopapp-db
spec:
  clusterIP: None
  selector:
    app: shopapp-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shopapp-db
  namespace: shopapp
  labels:
    app.kubernetes.io/name: shopapp-db
    app: shopapp-db
spec:
  replicas: 1
  serviceName: shopapp-db
  selector:
    matchLabels:
      app: shopapp-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopapp-db
        app: shopapp-db
    spec:
      nodeSelector:
        project: shopapp
      tolerations:
        - key: workload
          operator: Equal
          value: shopapp
          effect: NoSchedule
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: shopapp-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: shopapp-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopapp-db-secret
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopapp-db-secret
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-storage
        resources:
          requests:
            storage: 5Gi
