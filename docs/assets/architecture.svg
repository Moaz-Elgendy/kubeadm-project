<path class="l lcd" d="M1120 298V86" marker-end="url(#a-cd)"/>
<path class="l lmo" d="M669 546H742V634H814" marker-end="url(#a-mo)"/><text class="s halo" x="750" y="590">scrape</text><text class="s halo m" x="750" y="606">:9100</text>
<path class="l lpr dash" d="M165 505V472" marker-end="url(#a-pr)"/><text class="s halo" x="176" y="494">jenkins-setup.yml</text>
<path class="l lpr dash" d="M290 540H333" marker-end="url(#a-pr)"/><path class="l lpr dash" d="M312 540V714H975V687" marker-end="url(#a-pr)"/><text class="s halo" x="500" y="707">k8s-setup.yml · both VMs</text>
<g><circle cx="400" cy="52" r="11" class="fci"/><text class="on" x="400" y="56" text-anchor="middle">1</text><rect x="413" y="42" width="78" height="20" fill="var(--s-bg,#F7F8FA)"/><text class="b halo" x="418" y="57">git push</text>
<circle cx="100" cy="112" r="11" class="fci"/><text class="on" x="100" y="116" text-anchor="middle">2</text><text class="b halo" x="84" y="117" text-anchor="end">webhook</text>
<circle cx="190" cy="112" r="11" class="fci"/><text class="on" x="190" y="116" text-anchor="middle">4</text><text class="b halo" x="206" y="117">[ci skip]</text>
<circle cx="560" cy="168" r="11" class="fci"/><text class="on" x="560" y="172" text-anchor="middle">3</text><rect x="573" y="158" width="222" height="20" fill="var(--s-srv,#EDF0F4)"/><text class="b halo" x="578" y="173">build · scan · push image</text>
<circle cx="305" cy="112" r="11" class="fcd"/><text class="on" x="305" y="116" text-anchor="middle">5</text><text class="b halo" x="321" y="117">watch</text>
<circle cx="742" cy="406" r="11" class="fcd"/><text class="on" x="742" y="410" text-anchor="middle">6</text><text class="b halo" x="742" y="386" text-anchor="middle">rollout</text>
<circle cx="1120" cy="112" r="11" class="fcd"/><text class="on" x="1120" y="116" text-anchor="middle">7</text><text class="b halo" x="1104" y="117" text-anchor="end">pull image</text></g>
<!-- legend -->
<g transform="translate(20 785)"><rect class="ci" width="18" height="14" rx="3"/><text x="26" y="12">CI (1-4)</text>
<rect class="cd" x="130" width="18" height="14" rx="3"/><text x="156" y="12">CD (5-7)</text>
<rect class="mo" x="260" width="18" height="14" rx="3"/><text x="286" y="12">Monitoring</text>
<rect class="pr" x="400" width="18" height="14" rx="3"/><text x="426" y="12">Provisioning (Ansible)</text>
<text class="s" y="42">1 push to GitHub · 2 webhook starts Jenkins · 3 build, Trivy scan, push image · 4 Jenkins commits new tag with [ci skip]</text>
<text class="s" y="62">5 Argo CD watches the repo · 6 rolls out to shopapp · 7 pods pull the image · Nothing is exposed to the internet</text></g>
</svg>
